[package]
name = "annotator-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
argon2 = "=0.5.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
uuid = { version = "=1.28.0", features = ["v4"] }
chrono = "=0.4.45"
sha2 = "=0.10.9"
symphonia = { version = "=0.5.5", default-features = false, features = ["wav", "pcm", "flac", "mp3"] }
fs2 = "=0.4.3"
rustfft = "=6.4.1"
rubato = "=0.16.2"
cpal = "=0.15.3"
zip = { version = "=6.0.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"] }
